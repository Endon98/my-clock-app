<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clock</title>
    <style>
        #clock-display {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>
    <div id="clock-display">
        <!-- Clock will be displayed here -->
    </div>
    <script>
        const timeDisplay = document.getElementById('clock-display');

        // Function to get the current time and update the display
        const getTime = () => timeDisplay.textContent = new Date().toLocaleTimeString();

        // Configure the getTime function to execute every second
        document.addEventListener('DOMContentLoaded', () => {
            getTime();
            setInterval(getTime, 1000);
        })
    </script>
</body>
</html>
